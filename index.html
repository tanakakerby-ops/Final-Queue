<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - QueueEase</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>
  <nav>

      <button class="menu-btn" onclick="toggleMenu()">☰</button>

      <div class="menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="book.html">Book</a>
        <a href="queue.html">Queue</a>
        <a href="login.html">Staff</a>
        <a href="about.html">About</a>
      </div>
  </nav>

  <main>
    <h1>Welcome to QueueEase</h1>

    <!-- SLIDER 1: Home banner -->
    <div class="slider">
      <div class="slide s1"><h2>No more long lines</h2><p>Book your appointment online.</p></div>
      <div class="slide s2"><h2>Get your queue number</h2><p>Know when it is your turn.</p></div>
      <div class="slide s3"><h2>Watch the live queue</h2><p>See who is being served right now.</p></div>

      <button class="arrow prev" onclick="previousSlide()">&#10094;</button>
      <button class="arrow next" onclick="nextSlide()">&#10095;</button>

      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div class="card">
      <h2>Quick links</h2>
      <a class="btn" href="book.html">Book an appointment</a>
      <a class="btn" href="queue.html">View live queue</a>
    </div>
  </main>

  <footer>QueueEase - School Project</footer>
  <script src="script.js"></script>
  <script>function toggleMenu() {
    document.getElementById("mobileMenu").classList.toggle("open");
}
</script>
</body>
</html>
